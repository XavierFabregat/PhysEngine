name: Publish to npm

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v0.1.0, v1.2.3, etc.

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm provenance
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 is needed for trusted publishing (OIDC); npm 12
          # requires Node ^22.22.2 || ^24.15.0, so use Node 24
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run tests
        run: pnpm test:run
      
      - name: Build
        run: pnpm build

      - name: Check bundles
        run: pnpm check:bundles
      
      - name: Update npm for OIDC support
        # Pinned to a major: npm@latest (12.x) dropped Node 20 and broke the
        # v0.3.0 publish; bump deliberately
        run: npm install -g npm@11
      
      - name: Publish to npm
        run: npm publish --provenance --access public

